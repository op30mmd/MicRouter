# Build the native C++ backend for Linux and bundle it with the Flutter app.
#
# Companion to release-cpp-win.yml: builds the same C++ backend on Linux,
# bundles it with the Flutter Linux bundle as backend/microuter_backend_cpp,
# and packages the result as a .deb plus an AppImage (both "-cpp" suffixed).
# RNNoise is compiled to librnnoise.so and shipped next to the executable so
# the backend loads it at runtime.

name: Build and Release (Linux, C++ backend)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-cpp:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libportaudio2 portaudio19-dev \
            liblzma-dev libstdc++-12-dev cmake build-essential pkg-config

      - name: Build Flutter Linux App
        working-directory: desktop/frontend
        run: flutter build linux --release

      - name: Compile RNNoise Library (Linux)
        run: |
          mkdir rnnoise_build && cd rnnoise_build

          rnnoise_ref="6cbfd53eb348a8d394e0757b4025c6ded34eb2b6"
          base_src="https://raw.githubusercontent.com/xiph/rnnoise/$rnnoise_ref/src"
          base_inc="https://raw.githubusercontent.com/xiph/rnnoise/$rnnoise_ref/include"

          curl -O $base_inc/rnnoise.h
          curl -O $base_src/celt_lpc.h
          curl -O $base_src/kiss_fft.h
          curl -O $base_src/pitch.h
          curl -O $base_src/rnn.h
          curl -O $base_src/rnn_data.h
          curl -O $base_src/tansig_table.h
          curl -O $base_src/_kiss_fft_guts.h
          curl -O $base_src/arch.h
          curl -O $base_src/common.h
          curl -O $base_src/opus_types.h

          curl -O $base_src/celt_lpc.c
          curl -O $base_src/denoise.c
          curl -O $base_src/kiss_fft.c
          curl -O $base_src/pitch.c
          curl -O $base_src/rnn.c
          curl -O $base_src/rnn_data.c

          gcc -shared -o librnnoise.so -O3 -fPIC -std=gnu99 \
              -D_GNU_SOURCE -D_USE_MATH_DEFINES \
              celt_lpc.c denoise.c kiss_fft.c pitch.c rnn.c rnn_data.c \
              -I. -lm

      - name: Build C++ Backend
        run: |
          cd desktop/backend_cpp
          mkdir build_cpp && cd build_cpp
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM=ninja
          cmake --build . --target microuter_backend -j "$(nproc)"
          cp microuter_backend microuter_backend_cpp

      - name: Create Debian Package Structure
        run: |
          mkdir -p deb_root/usr/lib/microuter/backend deb_root/DEBIAN

          cp -r desktop/frontend/build/linux/x64/release/bundle/* deb_root/usr/lib/microuter/
          cp desktop/backend_cpp/build_cpp/microuter_backend_cpp deb_root/usr/lib/microuter/backend/
          chmod +x deb_root/usr/lib/microuter/backend/microuter_backend_cpp
          cp rnnoise_build/librnnoise.so deb_root/usr/lib/microuter/backend/

          mkdir -p deb_root/usr/bin deb_root/usr/share/applications
          cat > deb_root/usr/bin/microuter <<'EOF'
          #!/bin/bash
          cd /usr/lib/microuter
          ./microuter_pc "$@"
          EOF
          chmod +x deb_root/usr/bin/microuter

          cat > deb_root/usr/share/applications/microuter.desktop <<'EOF'
          [Desktop Entry]
          Name=MicRouter
          Comment=Use your Android phone as a microphone
          Exec=microuter
          Icon=audio-input-microphone
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;
          EOF

          cat > deb_root/DEBIAN/control <<'EOF'
          Package: microuter
          Version: 1.0.0-cpp
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libportaudio2, libgtk-3-0 | libgtk-3-0t64, pulseaudio-utils
          Maintainer: MicRouter Team
          Description: Use your Android phone as a microphone for your PC (native C++ backend).
          EOF

      - name: Build Debian Package
        run: dpkg-deb --build deb_root microuter-cpp_amd64.deb

      - name: Create AppImage Structure
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib/microuter/backend

          cp -r desktop/frontend/build/linux/x64/release/bundle/* AppDir/usr/lib/microuter/
          cp desktop/backend_cpp/build_cpp/microuter_backend_cpp AppDir/usr/lib/microuter/backend/
          chmod +x AppDir/usr/lib/microuter/backend/microuter_backend_cpp
          cp rnnoise_build/librnnoise.so AppDir/usr/lib/microuter/backend/

          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          cd "${HERE}/usr/lib/microuter"
          exec "./microuter_pc" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/microuter.desktop <<'EOF'
          [Desktop Entry]
          Name=MicRouter
          Comment=Use your Android phone as a microphone
          Exec=microuter
          Icon=audio-input-microphone
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;
          EOF
          touch AppDir/audio-input-microphone.png

      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir MicRouter-CppBackend-x86_64.AppImage

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: MicRouter-PC-Linux-CppBackend-Deb
          path: microuter-cpp_amd64.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: MicRouter-PC-Linux-CppBackend-AppImage
          path: MicRouter-CppBackend-x86_64.AppImage
