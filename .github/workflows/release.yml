# Single build-and-release pipeline for every platform.
#
# Android:  Gradle release APK.
# Windows:  Flutter app + native C++ backend (backend/microuter_backend_cpp.exe)
#           + RNNoise DLL, shipped as a zip and an Inno Setup installer.
# Linux:    Flutter app + native C++ backend + librnnoise.so, shipped as a
#           .deb and an AppImage.
#
# The C++ backend (desktop/backend_cpp) is the shipped engine on both desktop
# platforms; the Flutter frontend launches it in preference to the legacy
# Python backend. RNNoise is pinned to one upstream commit and compiled here so
# the backend can load it at runtime.
#
# Pushes to master bump the version tag and publish a GitHub release with all
# artifacts; pull requests and manual runs only build.

name: Build and Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # xiph/rnnoise commit compiled on every platform (reproducible builds).
  RNNOISE_REF: 6cbfd53eb348a8d394e0757b4025c6ded34eb2b6

jobs:
  compute_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag_version.outputs.new_version }}
      tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preview next version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

  build_android:
    needs: compute_version
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.compute_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $ANDROID_KEYSTORE_BASE64 | base64 --decode > android/app/release-key.jks
      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PversionName=$APP_VERSION -PversionCode=${{ github.run_number }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: microuter-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  build-windows:
    needs: compute_version
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.compute_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # Fills in any template file missing from the checkout; files that are
      # committed (the customised runner, the app icon) are left untouched.
      - name: Repair Windows Scaffolding
        working-directory: desktop/frontend
        run: flutter create --platforms=windows .

      - name: Build Flutter Windows App
        working-directory: desktop/frontend
        shell: bash
        run: flutter build windows --release --build-name=$APP_VERSION --build-number=${{ github.run_number }}

      - name: Compile RNNoise DLL
        shell: bash
        run: |
          mkdir rnnoise_build && cd rnnoise_build

          base_src="https://raw.githubusercontent.com/xiph/rnnoise/$RNNOISE_REF/src"
          base_inc="https://raw.githubusercontent.com/xiph/rnnoise/$RNNOISE_REF/include"

          curl -O $base_inc/rnnoise.h
          curl -O $base_src/celt_lpc.h
          curl -O $base_src/kiss_fft.h
          curl -O $base_src/pitch.h
          curl -O $base_src/rnn.h
          curl -O $base_src/rnn_data.h
          curl -O $base_src/tansig_table.h
          curl -O $base_src/_kiss_fft_guts.h
          curl -O $base_src/arch.h
          curl -O $base_src/common.h
          curl -O $base_src/opus_types.h

          curl -O $base_src/celt_lpc.c
          curl -O $base_src/denoise.c
          curl -O $base_src/kiss_fft.c
          curl -O $base_src/pitch.c
          curl -O $base_src/rnn.c
          curl -O $base_src/rnn_data.c

          # gcc (MinGW) rather than MSVC: RNNoise uses C99 VLAs, which cl.exe
          # rejects.
          gcc -shared -o rnnoise.dll -O3 -std=gnu99 \
              -D_USE_MATH_DEFINES \
              celt_lpc.c denoise.c kiss_fft.c pitch.c rnn.c rnn_data.c \
              -I.

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build C++ Backend
        shell: bash
        run: |
          cd desktop/backend_cpp
          # CMake + FetchContent build (PortAudio is fetched and compiled from
          # its own CMake rules). No -G flag: use CMake's default generator so
          # the build tracks whatever Visual Studio version the runner has
          # (a hardcoded "Visual Studio 17 2022" breaks when the image moves on).
          cmake -B build_cpp
          cmake --build build_cpp --config Release --target microuter_backend
          if [ -f build_cpp/Release/microuter_backend.exe ]; then
            cp build_cpp/Release/microuter_backend.exe microuter_backend_cpp.exe
          else
            cp build_cpp/microuter_backend.exe microuter_backend_cpp.exe
          fi

      - name: Assemble Release Folder
        shell: bash
        run: |
          mkdir release_package
          cp -r desktop/frontend/build/windows/x64/runner/Release/* release_package/

          mkdir release_package/backend
          cp desktop/backend_cpp/microuter_backend_cpp.exe release_package/backend/
          cp rnnoise_build/rnnoise.dll release_package/backend/

      - name: Zip Release
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'MicRouter-PC-Windows.zip'
          directory: 'release_package'

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicRouter-PC-Windows
          path: release_package/MicRouter-PC-Windows.zip

      - name: Create Inno Setup Script
        shell: bash
        run: |
          cat > microuter.iss <<EOF
          [Setup]
          AppName=MicRouter
          AppVersion=$APP_VERSION
          DefaultDirName={pf}\MicRouter
          DefaultGroupName=MicRouter
          OutputDir=.
          OutputBaseFilename=MicRouter-Installer
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "release_package\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\MicRouter"; Filename: "{app}\microuter_pc.exe"
          Name: "{commondesktop}\MicRouter"; Filename: "{app}\microuter_pc.exe"

          [Run]
          Filename: "{app}\microuter_pc.exe"; Description: "{cm:LaunchProgram,MicRouter}"; Flags: nowait postinstall skipifsilent
          EOF

      - name: Compile Windows Installer
        run: iscc microuter.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: MicRouter-PC-Windows-Installer
          path: MicRouter-Installer.exe

  build-linux:
    needs: compute_version
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: ${{ needs.compute_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libportaudio2 portaudio19-dev \
            liblzma-dev libstdc++-12-dev cmake build-essential pkg-config

      - name: Build Flutter Linux App
        working-directory: desktop/frontend
        run: flutter build linux --release --build-name=$APP_VERSION --build-number=${{ github.run_number }}

      - name: Compile RNNoise Library
        run: |
          mkdir rnnoise_build && cd rnnoise_build

          base_src="https://raw.githubusercontent.com/xiph/rnnoise/$RNNOISE_REF/src"
          base_inc="https://raw.githubusercontent.com/xiph/rnnoise/$RNNOISE_REF/include"

          curl -O $base_inc/rnnoise.h
          curl -O $base_src/celt_lpc.h
          curl -O $base_src/kiss_fft.h
          curl -O $base_src/pitch.h
          curl -O $base_src/rnn.h
          curl -O $base_src/rnn_data.h
          curl -O $base_src/tansig_table.h
          curl -O $base_src/_kiss_fft_guts.h
          curl -O $base_src/arch.h
          curl -O $base_src/common.h
          curl -O $base_src/opus_types.h

          curl -O $base_src/celt_lpc.c
          curl -O $base_src/denoise.c
          curl -O $base_src/kiss_fft.c
          curl -O $base_src/pitch.c
          curl -O $base_src/rnn.c
          curl -O $base_src/rnn_data.c

          gcc -shared -o librnnoise.so -O3 -fPIC -std=gnu99 \
              -D_GNU_SOURCE -D_USE_MATH_DEFINES \
              celt_lpc.c denoise.c kiss_fft.c pitch.c rnn.c rnn_data.c \
              -I. -lm

      - name: Build C++ Backend
        run: |
          cd desktop/backend_cpp
          mkdir build_cpp && cd build_cpp
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM=ninja
          cmake --build . --target microuter_backend -j "$(nproc)"
          cp microuter_backend microuter_backend_cpp

      - name: Create Debian Package Structure
        run: |
          mkdir -p deb_root/usr/lib/microuter/backend deb_root/DEBIAN

          cp -r desktop/frontend/build/linux/x64/release/bundle/* deb_root/usr/lib/microuter/
          cp desktop/backend_cpp/build_cpp/microuter_backend_cpp deb_root/usr/lib/microuter/backend/
          chmod +x deb_root/usr/lib/microuter/backend/microuter_backend_cpp
          cp rnnoise_build/librnnoise.so deb_root/usr/lib/microuter/backend/

          mkdir -p deb_root/usr/bin deb_root/usr/share/applications
          cat > deb_root/usr/bin/microuter <<'EOF'
          #!/bin/bash
          cd /usr/lib/microuter
          ./microuter_pc "$@"
          EOF
          chmod +x deb_root/usr/bin/microuter

          cat > deb_root/usr/share/applications/microuter.desktop <<'EOF'
          [Desktop Entry]
          Name=MicRouter
          Comment=Use your Android phone as a microphone
          Exec=microuter
          Icon=audio-input-microphone
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;
          EOF

          cat > deb_root/DEBIAN/control <<EOF
          Package: microuter
          Version: $APP_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libportaudio2, libgtk-3-0 | libgtk-3-0t64, pulseaudio-utils
          Maintainer: MicRouter Team
          Description: Use your Android phone as a microphone for your PC.
          EOF

      - name: Build Debian Package
        run: dpkg-deb --build deb_root microuter_${APP_VERSION}_amd64.deb

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: MicRouter-PC-Linux-Deb
          path: microuter_${{ needs.compute_version.outputs.version }}_amd64.deb

      - name: Create AppImage Structure
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib/microuter/backend

          cp -r desktop/frontend/build/linux/x64/release/bundle/* AppDir/usr/lib/microuter/
          cp desktop/backend_cpp/build_cpp/microuter_backend_cpp AppDir/usr/lib/microuter/backend/
          chmod +x AppDir/usr/lib/microuter/backend/microuter_backend_cpp
          cp rnnoise_build/librnnoise.so AppDir/usr/lib/microuter/backend/

          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          cd "${HERE}/usr/lib/microuter"
          exec "./microuter_pc" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/microuter.desktop <<'EOF'
          [Desktop Entry]
          Name=MicRouter
          Comment=Use your Android phone as a microphone
          Exec=microuter
          Icon=audio-input-microphone
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;
          EOF
          touch AppDir/audio-input-microphone.png

      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir MicRouter-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: MicRouter-PC-Linux-AppImage
          path: MicRouter-x86_64.AppImage

  release:
    runs-on: ubuntu-latest
    needs: [compute_version, build_android, build-windows, build-linux]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: microuter-apk

      - name: Download PC client zip
        uses: actions/download-artifact@v4
        with:
          name: MicRouter-PC-Windows

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: MicRouter-PC-Windows-Installer

      - name: Download Linux deb package
        uses: actions/download-artifact@v4
        with:
          name: MicRouter-PC-Linux-Deb

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: MicRouter-PC-Linux-AppImage

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag_version.outputs.new_tag }}
          VERSION: ${{ needs.compute_version.outputs.version }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            app-release.apk \
            MicRouter-PC-Windows.zip \
            MicRouter-Installer.exe \
            "microuter_${VERSION}_amd64.deb" \
            MicRouter-x86_64.AppImage
