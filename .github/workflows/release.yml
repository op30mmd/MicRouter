name: Build and Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $ANDROID_KEYSTORE_BASE64 | base64 --decode > android/app/release-key.jks
      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: microuter-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          # Install system header for PyAudio (PortAudio) on Linux
          sudo apt-get install -y portaudio19-dev 
          pip install -r desktop/backend/requirements.txt

      - name: Run Linter (Flake8)
        run: |
          # Check for syntax errors (E9) and undefined names (F63, F7, F82)
          # We ignore line length (E501) because UI code often has long lines
          flake8 desktop/backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 desktop/backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests
        run: |
          # Run the tests we created in Step 2
          python -m unittest discover -s desktop/backend/tests -p "test_*.py"

  build-windows:
    needs: test-python
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Repair Windows Scaffolding
        working-directory: desktop/frontend
        run: flutter create --platforms=windows .

      - name: Build Flutter Windows App
        working-directory: desktop/frontend
        run: flutter build windows --release

      - name: Compile RNNoise DLL
        shell: bash
        run: |
          mkdir rnnoise_build
          cd rnnoise_build
          
          base_src="https://raw.githubusercontent.com/xiph/rnnoise/master/src"
          base_inc="https://raw.githubusercontent.com/xiph/rnnoise/master/include"
          
          curl -O $base_inc/rnnoise.h
          curl -O $base_src/celt_lpc.h
          curl -O $base_src/kiss_fft.h
          curl -O $base_src/pitch.h
          curl -O $base_src/rnn.h
          curl -O $base_src/rnn_data.h
          curl -O $base_src/tansig_table.h
          curl -O $base_src/_kiss_fft_guts.h
          curl -O $base_src/arch.h
          curl -O $base_src/common.h
          curl -O $base_src/opus_types.h
          
          curl -O $base_src/celt_lpc.c
          curl -O $base_src/denoise.c
          curl -O $base_src/kiss_fft.c
          curl -O $base_src/pitch.c
          curl -O $base_src/rnn.c
          curl -O $base_src/rnn_data.c

          gcc -shared -o rnnoise.dll -O3 -std=gnu99 \
              -D_USE_MATH_DEFINES \
              celt_lpc.c denoise.c kiss_fft.c pitch.c rnn.c rnn_data.c \
              -I. 

          cd ..

      - name: Assemble Release Folder
        run: |
          mkdir release_package
          
          cp -r desktop/frontend/build/windows/x64/runner/Release/* release_package/
          
          mkdir release_package/backend
          cp desktop/backend/backend.py release_package/backend/
          cp desktop/backend/denoiser.py release_package/backend/
          cp desktop/backend/requirements.txt release_package/backend/
          
          mkdir release_package/backend/libs
          cp rnnoise_build/rnnoise.dll release_package/backend/libs/

      - name: Zip Release
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'MicRouter-PC-Windows.zip'
          directory: 'release_package'

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicRouter-PC-Windows
          path: release_package/MicRouter-PC-Windows.zip

  build-linux:
    needs: test-python
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libportaudio2 portaudio19-dev liblzma-dev libstdc++-12-dev

      - name: Build Flutter Linux App
        working-directory: desktop/frontend
        run: flutter build linux --release

      - name: Compile RNNoise Library (Linux)
        run: |
          mkdir rnnoise_build
          cd rnnoise_build

          base_src="https://raw.githubusercontent.com/xiph/rnnoise/master/src"
          base_inc="https://raw.githubusercontent.com/xiph/rnnoise/master/include"

          curl -O $base_inc/rnnoise.h
          curl -O $base_src/celt_lpc.h
          curl -O $base_src/kiss_fft.h
          curl -O $base_src/pitch.h
          curl -O $base_src/rnn.h
          curl -O $base_src/rnn_data.h
          curl -O $base_src/tansig_table.h
          curl -O $base_src/_kiss_fft_guts.h
          curl -O $base_src/arch.h
          curl -O $base_src/common.h
          curl -O $base_src/opus_types.h

          curl -O $base_src/celt_lpc.c
          curl -O $base_src/denoise.c
          curl -O $base_src/kiss_fft.c
          curl -O $base_src/pitch.c
          curl -O $base_src/rnn.c
          curl -O $base_src/rnn_data.c

          gcc -shared -o rnnoise.so -O3 -fPIC -std=gnu99 \
              -D_GNU_SOURCE -D_USE_MATH_DEFINES \
              celt_lpc.c denoise.c kiss_fft.c pitch.c rnn.c rnn_data.c \
              -I. -lm

      - name: Create Debian Package Structure
        run: |
          mkdir -p deb_root/usr/bin
          mkdir -p deb_root/usr/lib/microuter/backend/libs
          mkdir -p deb_root/DEBIAN

          # App binary and assets
          cp -r desktop/frontend/build/linux/x64/release/bundle/* deb_root/usr/lib/microuter/

          # Launcher script
          cat > deb_root/usr/bin/microuter <<EOF
          #!/bin/bash
          cd /usr/lib/microuter
          ./microuter_pc "\$@"
          EOF
          chmod +x deb_root/usr/bin/microuter

          # Backend
          cp desktop/backend/backend.py deb_root/usr/lib/microuter/backend/
          cp desktop/backend/denoiser.py deb_root/usr/lib/microuter/backend/
          cp desktop/backend/requirements.txt deb_root/usr/lib/microuter/backend/
          cp rnnoise_build/rnnoise.so deb_root/usr/lib/microuter/backend/libs/

          # Control file
          cat > deb_root/DEBIAN/control <<EOF
          Package: microuter
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: python3, python3-pip, python3-numpy, python3-pyaudio, libportaudio2, libgtk-3-0 | libgtk-3-0t64
          Maintainer: MicRouter Team
          Description: Use your Android phone as a microphone for your PC.
          EOF

      - name: Build Debian Package
        run: dpkg-deb --build deb_root microuter_1.0.0_amd64.deb

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: MicRouter-PC-Linux-Deb
          path: microuter_1.0.0_amd64.deb

  release:
    runs-on: ubuntu-latest
    needs: [build_android, build-windows, build-linux]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: microuter-apk

      - name: Download PC client zip
        uses: actions/download-artifact@v4
        with:
          name: MicRouter-PC-Windows

      - name: Download Linux deb package
        uses: actions/download-artifact@v4
        with:
          name: MicRouter-PC-Linux-Deb

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          generate_release_notes: true
          files: |
            app-release.apk
            MicRouter-PC-Windows.zip
            microuter_1.0.0_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
