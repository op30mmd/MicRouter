name: Build and Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag_version.outputs.new_version }}
      tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preview next version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

  build_android:
    needs: compute_version
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.compute_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $ANDROID_KEYSTORE_BASE64 | base64 --decode > android/app/release-key.jks
      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PversionName=$APP_VERSION -PversionCode=${{ github.run_number }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: microuter-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          # Install system header for PyAudio (PortAudio) on Linux
          sudo apt-get install -y portaudio19-dev
          pip install -r desktop/backend/requirements-dev.txt

      - name: Run Linter (Flake8)
        run: |
          # Check for syntax errors (E9) and undefined names (F63, F7, F82)
          # We ignore line length (E501) because UI code often has long lines
          flake8 desktop/backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 desktop/backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests
        run: |
          # Run the tests we created in Step 2
          python -m unittest discover -s desktop/backend/tests -p "test_*.py"

  build-windows:
    needs: [compute_version, test-python]
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.compute_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Repair Windows Scaffolding
        working-directory: desktop/frontend
        run: flutter create --platforms=windows .

      - name: Build Flutter Windows App
        working-directory: desktop/frontend
        shell: bash
        run: flutter build windows --release --build-name=$APP_VERSION --build-number=${{ github.run_number }}

      - name: Compile RNNoise DLL
        shell: bash
        run: |
          mkdir rnnoise_build
          cd rnnoise_build

          # Pinned to a specific upstream commit so the build is reproducible
          # and doesn't break if xiph/rnnoise's master branch changes shape.
          rnnoise_ref="6cbfd53eb348a8d394e0757b4025c6ded34eb2b6"
          base_src="https://raw.githubusercontent.com/xiph/rnnoise/$rnnoise_ref/src"
          base_inc="https://raw.githubusercontent.com/xiph/rnnoise/$rnnoise_ref/include"

          curl -O $base_inc/rnnoise.h
          curl -O $base_src/celt_lpc.h
          curl -O $base_src/kiss_fft.h
          curl -O $base_src/pitch.h
          curl -O $base_src/rnn.h
          curl -O $base_src/rnn_data.h
          curl -O $base_src/tansig_table.h
          curl -O $base_src/_kiss_fft_guts.h
          curl -O $base_src/arch.h
          curl -O $base_src/common.h
          curl -O $base_src/opus_types.h

          curl -O $base_src/celt_lpc.c
          curl -O $base_src/denoise.c
          curl -O $base_src/kiss_fft.c
          curl -O $base_src/pitch.c
          curl -O $base_src/rnn.c
          curl -O $base_src/rnn_data.c

          gcc -shared -o rnnoise.dll -O3 -std=gnu99 \
              -D_USE_MATH_DEFINES \
              celt_lpc.c denoise.c kiss_fft.c pitch.c rnn.c rnn_data.c \
              -I.

          cd ..

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Backend Build Dependencies
        run: pip install -r desktop/backend/requirements-dev.txt

      - name: Build Backend Executable
        shell: bash
        run: |
          pyinstaller --onefile --name microuter_backend \
            --add-binary "$GITHUB_WORKSPACE/rnnoise_build/rnnoise.dll;libs" \
            --distpath dist_backend --workpath build_backend --specpath build_backend \
            desktop/backend/backend.py

      - name: Assemble Release Folder
        run: |
          mkdir release_package

          cp -r desktop/frontend/build/windows/x64/runner/Release/* release_package/

          mkdir release_package/backend
          cp dist_backend/microuter_backend.exe release_package/backend/

      - name: Zip Release
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'MicRouter-PC-Windows.zip'
          directory: 'release_package'

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicRouter-PC-Windows
          path: release_package/MicRouter-PC-Windows.zip

      - name: Create Inno Setup Script
        shell: bash
        run: |
          cat > microuter.iss <<EOF
          [Setup]
          AppName=MicRouter
          AppVersion=$APP_VERSION
          DefaultDirName={pf}\MicRouter
          DefaultGroupName=MicRouter
          OutputDir=.
          OutputBaseFilename=MicRouter-Installer
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "release_package\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\MicRouter"; Filename: "{app}\microuter_pc.exe"
          Name: "{commondesktop}\MicRouter"; Filename: "{app}\microuter_pc.exe"

          [Run]
          Filename: "{app}\microuter_pc.exe"; Description: "{cm:LaunchProgram,MicRouter}"; Flags: nowait postinstall skipifsilent
          EOF

      - name: Compile Windows Installer
        run: iscc microuter.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: MicRouter-PC-Windows-Installer
          path: MicRouter-Installer.exe

  build-linux:
    needs: [compute_version, test-python]
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: ${{ needs.compute_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libportaudio2 portaudio19-dev liblzma-dev libstdc++-12-dev

      - name: Build Flutter Linux App
        working-directory: desktop/frontend
        run: flutter build linux --release --build-name=$APP_VERSION --build-number=${{ github.run_number }}

      - name: Compile RNNoise Library (Linux)
        run: |
          mkdir rnnoise_build
          cd rnnoise_build

          # Pinned to a specific upstream commit so the build is reproducible
          # and doesn't break if xiph/rnnoise's master branch changes shape.
          rnnoise_ref="6cbfd53eb348a8d394e0757b4025c6ded34eb2b6"
          base_src="https://raw.githubusercontent.com/xiph/rnnoise/$rnnoise_ref/src"
          base_inc="https://raw.githubusercontent.com/xiph/rnnoise/$rnnoise_ref/include"

          curl -O $base_inc/rnnoise.h
          curl -O $base_src/celt_lpc.h
          curl -O $base_src/kiss_fft.h
          curl -O $base_src/pitch.h
          curl -O $base_src/rnn.h
          curl -O $base_src/rnn_data.h
          curl -O $base_src/tansig_table.h
          curl -O $base_src/_kiss_fft_guts.h
          curl -O $base_src/arch.h
          curl -O $base_src/common.h
          curl -O $base_src/opus_types.h

          curl -O $base_src/celt_lpc.c
          curl -O $base_src/denoise.c
          curl -O $base_src/kiss_fft.c
          curl -O $base_src/pitch.c
          curl -O $base_src/rnn.c
          curl -O $base_src/rnn_data.c

          gcc -shared -o rnnoise.so -O3 -fPIC -std=gnu99 \
              -D_GNU_SOURCE -D_USE_MATH_DEFINES \
              celt_lpc.c denoise.c kiss_fft.c pitch.c rnn.c rnn_data.c \
              -I. -lm

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Backend Build Dependencies
        run: pip install -r desktop/backend/requirements-dev.txt

      - name: Build Backend Executable
        run: |
          pyinstaller --onefile --name microuter_backend \
            --add-binary "$GITHUB_WORKSPACE/rnnoise_build/rnnoise.so:libs" \
            --distpath dist_backend --workpath build_backend --specpath build_backend \
            desktop/backend/backend.py

      - name: Create Debian Package Structure
        run: |
          mkdir -p deb_root/usr/bin
          mkdir -p deb_root/usr/lib/microuter/backend
          mkdir -p deb_root/DEBIAN

          # App binary and assets
          cp -r desktop/frontend/build/linux/x64/release/bundle/* deb_root/usr/lib/microuter/

          # Launcher script
          cat > deb_root/usr/bin/microuter <<EOF
          #!/bin/bash
          cd /usr/lib/microuter
          ./microuter_pc "\$@"
          EOF
          chmod +x deb_root/usr/bin/microuter

          # Desktop Entry
          mkdir -p deb_root/usr/share/applications
          cat > deb_root/usr/share/applications/microuter.desktop <<EOF
          [Desktop Entry]
          Name=MicRouter
          Comment=Use your Android phone as a microphone
          Exec=microuter
          Icon=audio-input-microphone
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;
          EOF

          # Backend: self-contained executable, no system Python required
          cp dist_backend/microuter_backend deb_root/usr/lib/microuter/backend/
          chmod +x deb_root/usr/lib/microuter/backend/microuter_backend

          # Control file
          cat > deb_root/DEBIAN/control <<EOF
          Package: microuter
          Version: $APP_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libportaudio2, libgtk-3-0 | libgtk-3-0t64, pulseaudio-utils
          Maintainer: MicRouter Team
          Description: Use your Android phone as a microphone for your PC.
          EOF

      - name: Build Debian Package
        run: dpkg-deb --build deb_root microuter_${APP_VERSION}_amd64.deb

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: MicRouter-PC-Linux-Deb
          path: microuter_${{ needs.compute_version.outputs.version }}_amd64.deb

  release:
    runs-on: ubuntu-latest
    needs: [compute_version, build_android, build-windows, build-linux]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: microuter-apk

      - name: Download PC client zip
        uses: actions/download-artifact@v4
        with:
          name: MicRouter-PC-Windows

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: MicRouter-PC-Windows-Installer

      - name: Download Linux deb package
        uses: actions/download-artifact@v4
        with:
          name: MicRouter-PC-Linux-Deb

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          generate_release_notes: true
          files: |
            app-release.apk
            MicRouter-PC-Windows.zip
            MicRouter-Installer.exe
            microuter_${{ needs.compute_version.outputs.version }}_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
